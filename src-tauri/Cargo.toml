[package]
name = "m3u8-bridge"
version = "0.1.1"
description = "Local-first browser media downloader"
authors = ["yet another downloader contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/shumybest/yet-another-downloader"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "=1.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tauri = { version = "=1.8.3", features = ["process-command-api", "system-tray"] }
tauri-plugin-deep-link = "=0.1.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
